<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فاتورة طلب - متجر مناحل شيخ الجبل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      padding: 40px 20px;
      background: #fffdf5;
      color: #451a03;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .invoice-card { width: 100%; max-width: 650px; background: #fff; padding: 40px; border-radius: 20px; border: 1px solid #fde68a; box-shadow: 0 20px 25px -5px rgba(217, 119, 6, 0.08); }
    .header { text-align: center; border-bottom: 2px dashed #fde68a; padding-bottom: 24px; margin-bottom: 24px; }
    .header h2 { color: #d97706; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    .header p { color: #78350f; font-size: 14px; margin-top: 4px; font-weight: 500; }
    .table { width: 100%; border-collapse: collapse; margin: 24px 0; }
    .table th, .table td { border: 1px solid #fde68a; padding: 14px 16px; text-align: right; font-size: 14px; }
    .table th { background: #fefce8; color: #451a03; font-weight: 700; }
    .total-box { margin-top: 15px; font-size: 16px; font-weight: 800; text-align: left; color: #d97706; }
    .location-box { background: #fefce8; border: 1px solid #fde68a; padding: 14px; border-radius: 10px; color: #78350f; font-size: 14px; font-weight: 700; margin-top: 15px; }
    .btn-print { background: #d97706; color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; display: block; margin: 30px auto 0; transition: 0.2s; }
    .btn-print:hover { background: #b45309; }
    .dev-footer { text-align: center; margin-top: 20px; font-weight: bold; font-size: 14px; }
    .dev-footer a { color: #25d366; text-decoration: none; }
    @media print { body { background: #fff; padding: 0; } .invoice-card { border: none; box-shadow: none; } .btn-print, .dev-footer { display: none; } }
  </style>
</head>
<body>
  <div class="invoice-card">
    <div class="header">
      <h2>🍯 متجر مناحل شيخ الجبل للعسل الحضرمي الدوعني</h2>
      <p id="inv-id"></p>
      <p id="inv-customer"></p>
      <p id="inv-date"></p>
    </div>
    <h3 style="font-size:16px; font-weight:700;">تفاصيل الطلب:</h3>
    <table class="table">
      <thead>
        <tr>
          <th>نوع العسل / المنتج</th>
          <th>الكمية</th>
          <th>السعر الفردي</th>
          <th>الإجمالي</th>
        </tr>
      </thead>
      <tbody id="inv-items"></tbody>
    </table>
    <div class="total-box" id="inv-total"></div>
    <div class="location-box">📍 <strong>عنوان التوصيل:</strong> <span id="inv-loc"></span></div>
    <button class="btn-print" onclick="window.print()">طباعة الفاتورة 🖨️</button>
  </div>

  <div class="dev-footer">
    برمجة أبو سيف <a href="https://wa.me/966553804010" target="_blank">966553804010</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (rawData) {
      const data = JSON.parse(decodeURIComponent(rawData));
      document.getElementById('inv-id').innerText = "رقم الفاتورة: " + data.id;
      if (data.customerName) {
        document.getElementById('inv-customer').innerText = "اسم العميل: " + data.customerName;
      }
      document.getElementById('inv-date').innerText = "التاريخ: " + data.date;
      document.getElementById('inv-loc').innerText = data.location;
      
      const tbody = document.getElementById('inv-items');
      let totals = {};

      data.items.forEach(item => {
        let curr = item.currency || 'ر.س';
        let subtotal = Number(item.price) * (item.qty || 1);
        totals[curr] = (totals[curr] || 0) + subtotal;

        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.qty || 1}</td>
            <td>${item.price} ${curr}</td>
            <td>${subtotal} ${curr}</td>
          </tr>
        `;
      });

      let totalStr = Object.keys(totals).map(curr => `${totals[curr]} ${curr}`).join(' | ');
      document.getElementById('inv-total').innerText = "الإجمالي الكلي: " + totalStr;
    }
  </script>
</body>
</html>
